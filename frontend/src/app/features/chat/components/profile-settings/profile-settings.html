<div class="settings-backdrop" [class.open]="isOpen" (click)="close.emit()">
  <div class="settings-drawer" [class.open]="isOpen" (click)="$event.stopPropagation()">
    
    <div class="settings-header">
      <h3>My Profile Settings</h3>
      <button mat-icon-button (click)="close.emit()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="settings-content">
      
      <!-- Current Avatar Preview -->
      <div class="avatar-preview-container">
        <div class="avatar-ring">
          <img [src]="avatarUrl() || 'https://ui-avatars.com/api/?name=User'" alt="Avatar Preview">
        </div>
        <p class="preview-label">Avatar Preview</p>
      </div>

      <!-- Avatar Preset Picker -->
      <div class="avatar-picker-section">
        <h4>Choose an Avatar</h4>
        <div class="avatar-grid">
          @for (avatar of avatars; track avatar) {
            <div class="avatar-option" 
                 [class.selected]="avatarUrl() === avatar" 
                 (click)="selectAvatar(avatar)">
              <img [src]="avatar" alt="Avatar Option">
            </div>
          }
        </div>
      </div>

      <!-- Form Inputs -->
      <div class="settings-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Display Name</mat-label>
          <input matInput [ngModel]="username()" (ngModelChange)="username.set($event)" placeholder="Enter your display name">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>
      </div>

      @if (successMsg()) {
        <div class="success-alert">
          <mat-icon>check_circle</mat-icon>
          <span>{{ successMsg() }}</span>
        </div>
      }

    </div>

    <div class="settings-footer">
      <button mat-button class="cancel-btn" (click)="close.emit()" [disabled]="isSaving()">Cancel</button>
      <button mat-flat-button class="save-btn" (click)="save()" [disabled]="isSaving() || !username().trim()">
        @if (isSaving()) {
          <span>Saving...</span>
        } @else {
          <span>Save Changes</span>
        }
      </button>
    </div>

  </div>
</div>
